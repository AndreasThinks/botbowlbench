{% extends "base.html" %}
{% block title %}Match · BotBowl Bench{% endblock %}
{% block content %}
<div class="match-bar">
  <div id="crumb" class="secondary"></div>
  <div id="links" class="match-links"></div>
</div>
<div class="live-layout">
  <div class="card stadium-card" id="stadium-card">
    <div id="stadium"><div class="stadium-empty">Loading…</div></div>
    <div class="player" id="player" hidden>
      <div class="player-row">
        <button type="button" class="pbtn" id="p-prevturn" title="Previous turn (Shift+←)" aria-label="Previous turn">⏮</button>
        <button type="button" class="pbtn" id="p-back" title="Step back (←)" aria-label="Step back">◀</button>
        <button type="button" class="pbtn play" id="p-play" title="Play / pause (Space)" aria-label="Play">▶</button>
        <button type="button" class="pbtn" id="p-fwd" title="Step forward (→)" aria-label="Step forward">▶|</button>
        <button type="button" class="pbtn" id="p-nextturn" title="Next turn (Shift+→)" aria-label="Next turn">⏭</button>
        <select id="p-speed" aria-label="Playback speed">
          <option value="0.5">0.5×</option><option value="1">1×</option><option value="2" selected>2×</option>
          <option value="4">4×</option><option value="8">8×</option>
        </select>
        <span class="player-pos" id="p-pos"></span>
        <label class="player-opt"><input type="checkbox" id="p-hide"> Hide result</label>
      </div>
      <div class="scrub">
        <div class="scrub-marks" id="p-marks" aria-hidden="true"></div>
        <input type="range" id="p-range" min="0" max="0" value="0" aria-label="Replay position">
      </div>
      <div class="muted player-final" id="p-final"></div>
    </div>
  </div>
  <div class="card feed" id="feed-card">
    <div class="feed-tabs" role="tablist">
      <button data-tab="log" class="active">Game log</button>
      <button data-tab="chat">Chat</button>
      <button data-tab="plans">Plans</button>
      <button data-tab="all">Model reasoning</button>
      <button data-tab="home">Home only</button>
      <button data-tab="away">Away only</button>
      <label class="player-opt" id="sync-wrap" hidden title="Only show what had happened at this point of the replay"><input type="checkbox" id="p-sync" checked> Sync with replay</label>
    </div>
    <div class="feed-body" id="feed" aria-live="polite"></div>
  </div>
</div>
<div class="muted" id="board-note" style="font-size:.8rem;margin-top:6px"></div>
<div class="card section" id="stats-card" style="display:none">
  <h2>Match stats</h2>
  <div class="table-wrap"><table class="compare" id="stats"></table></div>
  <div class="muted" id="meta-line" style="font-size:.8rem;margin-top:10px"></div>
</div>
{% endblock %}
{% block scripts %}
<script src="/bench-static/board.js"></script>
<script>
const { h, api, fmt } = BB;
const MATCH_ID = {{ match_id|tojson }};
let match = null, events = [], lastId = 0, tab = "log", boardMode = null;
const FRAME_SPEED_DEFAULT = 2;

const names = () => ({ home: match ? match.home_name : "Home", away: match ? match.away_name : "Away" });

// one stadium component draws the board for both live games and replays
const stadium = BBBoard.create(document.getElementById("stadium"), {
  names: () => ({
    home: h("a", { href: `/models/${match.home_model}` }, match.home_name),
    away: h("a", { href: `/models/${match.away_model}` }, match.away_name),
  }),
  badge: () => boardMode === "live" ? h("span", { class: "badge live" }, "● LIVE")
    : boardMode === "replay" ? h("span", { class: "badge" }, "REPLAY") : null,
  onLog: () => showTab("log"),
});

function setBoard(mode) {
  if (mode === boardMode) return;
  boardMode = mode;
  const note = document.getElementById("board-note");
  if (mode === "live") {
    stadium.live(MATCH_ID);
    note.textContent = "Live — the board updates as the models act. Hover a player for details.";
  } else if (mode === "replay") {
    stadium.stop();
    note.textContent = "Keys: Space play/pause · ← → step · Shift+← → jump a turn. On the scrubber, ▲ marks touchdowns and ticks mark turns.";
    initReplay();
  } else {
    document.getElementById("stadium").innerHTML = '<div class="stadium-empty">The board appears when the match kicks off.</div>';
    note.textContent = "";
  }
}

// ---- replay player ---------------------------------------------------------------------------------
const R = { active: false, points: [], idx: 0, playing: false, timer: null, speed: FRAME_SPEED_DEFAULT, turns: [], tds: [],
            sync: true, hide: false, ready: false };
const FRAME_MS = 650;   // at 1x
try { R.hide = localStorage.getItem("bb-hide-result") === "1"; } catch (e) {}

function turnLabel(p) {
  if (!p) return "";
  if (!p.side) return p.over ? "Full time" : `Half ${p.half ?? 1} · kick-off`;
  const t = p.side === "home" ? p.ht : p.at;
  return `Half ${p.half} · ${names()[p.side]} turn ${t}`;
}

function initReplay() {
  api(`/api/matches/${MATCH_ID}/timeline`).then((tl) => {
    if (!tl.frames) return;
    R.active = true; R.points = tl.points;
    const last = R.points.length - 1;
    // turn starts and touchdowns, for the scrubber markers and turn jumps
    let prevKey = null;
    R.points.forEach((p, i) => {
      const key = p.side ? `${p.half}-${p.side}-${p.side === "home" ? p.ht : p.at}` : null;
      if (key && key !== prevKey) R.turns.push(i);
      if (key) prevKey = key;
      const q = R.points[i - 1];
      if (q && (p.hs > q.hs || p.as > q.as)) R.tds.push({ i, side: p.hs > q.hs ? "home" : "away" });
    });
    const range = document.getElementById("p-range");
    range.max = last;
    const marks = document.getElementById("p-marks");
    const pct = (i) => (last ? (i / last) * 100 : 0);
    R.turns.forEach((i) => marks.append(h("span", { class: "tick", style: { left: pct(i) + "%" } })));
    R.tds.forEach((t) => marks.append(h("button", { type: "button", class: `td ${t.side}`, style: { left: pct(t.i) + "%" },
      title: `Touchdown: ${names()[t.side]}`, "aria-label": `Jump to ${names()[t.side]} touchdown`,
      onclick: () => seek(Math.max(0, turnStartOf(t.i))) }, "▲")));
    document.getElementById("player").hidden = false;
    document.getElementById("sync-wrap").hidden = false;
    document.getElementById("p-hide").checked = R.hide;
    const m = /f=(\d+)/.exec(location.hash);
    seek(m ? Math.min(last, parseInt(m[1])) : 0, true);
    renderFeed(true);   // log lines rendered before the timeline loaded become clickable
  });
}

function turnStartOf(i) {
  let s = 0;
  for (const t of R.turns) { if (t <= i) s = t; else break; }
  return s;
}

function cutoffTs() {
  // show what had been logged by this frame (tool results land a few ms after their frame)
  const p = R.points[R.idx], next = R.points[R.idx + 1];
  if (!p || !next) return Infinity;
  return Math.min(p.ts + 0.25, next.ts - 0.001);
}

function postFrame() {
  stadium.frame(MATCH_ID, R.idx, R.points.length);
}

function seek(i, quiet) {
  R.idx = Math.max(0, Math.min(R.points.length - 1, i));
  document.getElementById("p-range").value = R.idx;
  postFrame();
  renderReplayState();
  renderFeed(false);
  markCurrent();
  if (!quiet && !R.playing) history.replaceState(null, "", `#f=${R.idx}`);
}

function renderReplayState() {
  const p = R.points[R.idx], last = R.points.length - 1;
  document.getElementById("p-pos").textContent = `${turnLabel(p)} · ${R.idx + 1}/${last + 1}`;
  renderCrumb();
  const fin = document.getElementById("p-final");
  fin.textContent = R.hide && R.idx < last ? "Result hidden until the end of the replay." : `Final: ${finalScore()} · ${finalText()}`;
  const showStats = !(R.hide && R.idx < last);
  document.getElementById("stats-card").style.display = showStats && match.home_stats ? "" : "none";
  document.getElementById("p-play").textContent = R.playing ? "❚❚" : "▶";
  document.getElementById("p-play").setAttribute("aria-label", R.playing ? "Pause" : "Play");
}

function finalScore() { return `${match.away_name} ${match.away_score} – ${match.home_score} ${match.home_name}`; }
function finalText() {
  if (match.status !== "completed") return match.status;
  return match.winner === "draw" ? "Full time · draw" : `Full time · ${match.winner === "home" ? match.home_name : match.away_name} wins`;
}

function play(on) {
  R.playing = on;
  clearTimeout(R.timer);
  if (on && R.idx >= R.points.length - 1) seek(0, true);
  const tick = () => {
    if (!R.playing) return;
    if (R.idx >= R.points.length - 1) { play(false); history.replaceState(null, "", `#f=${R.idx}`); return; }
    seek(R.idx + 1, true);
    R.timer = setTimeout(tick, FRAME_MS / R.speed);
  };
  if (on) R.timer = setTimeout(tick, FRAME_MS / R.speed);
  else history.replaceState(null, "", `#f=${R.idx}`);
  renderReplayState();
}

function jumpTurn(dir) {
  if (dir < 0) {
    const cur = turnStartOf(R.idx);
    const prev = R.turns.filter((t) => t < (R.idx - cur > 1 ? cur + 1 : cur));
    seek(prev.length ? prev[prev.length - 1] : 0);
  } else {
    const next = R.turns.find((t) => t > R.idx);
    seek(next !== undefined ? next : R.points.length - 1);
  }
}

document.getElementById("p-play").onclick = () => play(!R.playing);
document.getElementById("p-back").onclick = () => { play(false); seek(R.idx - 1); };
document.getElementById("p-fwd").onclick = () => { play(false); seek(R.idx + 1); };
document.getElementById("p-prevturn").onclick = () => jumpTurn(-1);
document.getElementById("p-nextturn").onclick = () => jumpTurn(1);
document.getElementById("p-speed").onchange = (e) => { R.speed = parseFloat(e.target.value); if (R.playing) play(true); };
document.getElementById("p-range").oninput = (e) => { seek(parseInt(e.target.value), R.playing); };
document.getElementById("p-hide").onchange = (e) => {
  R.hide = e.target.checked;
  try { localStorage.setItem("bb-hide-result", R.hide ? "1" : "0"); } catch (err) {}
  renderReplayState();
};
document.getElementById("p-sync").onchange = (e) => { R.sync = e.target.checked; renderFeed(true); };
// Space must not also "click" a focused button/checkbox (that would undo the play/pause toggle)
document.addEventListener("keyup", (e) => {
  const el = focused();
  if (R.active && e.key === " " && (el.tagName === "BUTTON" || el.type === "checkbox")) e.preventDefault();
});
// player controls give focus back to the page, so keyboard shortcuts keep working after a click
for (const type of ["click", "change"]) {
  document.addEventListener(type, (e) => {
    const el = e.target;
    if (el.closest && el.closest("#player, .feed-tabs") && (el.tagName === "BUTTON" || el.type === "checkbox" ||
        (type === "change" && el.tagName === "SELECT"))) el.blur();
  });
}
const focused = () => document.activeElement || document.body;
const isTyping = (el) => el.tagName === "TEXTAREA" || el.tagName === "SELECT" ||
  (el.tagName === "INPUT" && !["checkbox", "range", "button"].includes(el.type));
document.addEventListener("keydown", (e) => {
  const el = focused();
  if (!R.active || e.altKey || e.ctrlKey || e.metaKey || isTyping(el)) return;
  if (el.type === "range" && !e.shiftKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")) return;  // native step
  if (e.key === " ") { e.preventDefault(); play(!R.playing); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); play(false); e.shiftKey ? jumpTurn(-1) : seek(R.idx - 1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); play(false); e.shiftKey ? jumpTurn(1) : seek(R.idx + 1); }
});

function renderCrumb() {
  const crumb = document.getElementById("crumb"); crumb.innerHTML = "";
  if (match.tournament) crumb.append(h("a", { href: `/tournaments/${match.tournament.id}` }, match.tournament.name));
  crumb.append(` · ${match.away_name} (away) vs ${match.home_name} (home)`);
  const spoiler = R.active && R.hide && R.idx < R.points.length - 1;
  if (match.status === "completed" && !spoiler) crumb.append(" · ", h("b", {}, finalText().replace("Full time · ", "")));
  else if (match.status === "running") crumb.append(" · live now");
  else if (match.status === "queued") crumb.append(" · scheduled");
  if (match.duration) crumb.append(` · ${fmt.dur(match.duration)}`);
  if (match.error) crumb.append(h("span", { style: { color: "var(--critical)" } }, ` · error: ${match.error}`));
  const links = document.getElementById("links"); links.innerHTML = "";
  if (match.has_transcript) links.append(h("a", { href: `/api/matches/${MATCH_ID}/transcript` }, "Transcript"));
  links.append(h("a", { href: "/matches" }, "All matches"));
}

function renderHeader() {
  renderCrumb();
  setBoard(match.status === "running" ? "live" : (match.status === "completed" || match.status === "error") && match.frames ? "replay" : "none");
}

function argStr(a) { return Object.entries(a || {}).filter(([, v]) => v != null).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", "); }

// tool calls in words ("H3 blocks A5"); the raw call stays one click away
function toolText(name, a) {
  a = a || {};
  const p = a.player_id || "?", at = (x, y) => (x != null && y != null ? ` to (${x}, ${y})` : "");
  const via = (x, y) => (x != null && y != null ? ` via (${x}, ${y})` : "");
  switch (name) {
    case "move": return `${p} moves${at(a.x, a.y)}`;
    case "block": return `${p} blocks ${a.target_id}`;
    case "blitz": return `${p} blitzes ${a.target_id}${via(a.via_x, a.via_y)}`;
    case "pass_ball": return `${p} passes${at(a.target_x, a.target_y)}`;
    case "handoff": return `${p} hands off to ${a.target_id}`;
    case "foul": return `${p} fouls ${a.target_id}`;
    case "end_turn": return "Ends the turn";
    case "reflect": return "Writes a plan";
    case "send_message": return "Sends a message";
    case "get_state": return "Looks at the board";
    case "get_legal_actions": return "Checks the legal actions";
    case "get_player": return `Looks up ${a.player_id}`;
    case "take_action": {
      const what = String(a.action_type || "action").toLowerCase().replace(/_/g, " ");
      const where = a.x != null && a.y != null ? ` ${what === "move" ? "to" : "at"} (${a.x}, ${a.y})` : "";
      return a.player_id ? `${a.player_id}: ${what}${where}` : what[0].toUpperCase() + what.slice(1) + where;
    }
    default: return `${name}(${argStr(a)})`;
  }
}

// game log text: team placeholders become names, player ids get their team colour
function logText(t) {
  const n = names();
  const parts = t.replace(/Home\(H\)/g, n.home).replace(/Away\(A\)/g, n.away).split(/\b([HA]\d{1,2})\b/);
  return parts.map((x, i) => (i % 2 ? h("span", { class: `pid ${x[0] === "H" ? "home" : "away"}` }, x) : x));
}

// the game log is a list of turn groups (header + lines), so each sticky header stays within its turn
let logGroup = null;
function playNodes(e) {
  const p = e.payload || {};
  const turn = e.side === "home" ? p.ht : p.at, side = e.side && turn ? e.side : null;   // turn 0: pre-game / kick-off
  const key = side ? `${p.half}-${side}-${turn}` : `${p.half}-kickoff`;
  let fresh = null;
  if (!logGroup || logGroup.dataset.turn !== key || logGroup !== document.getElementById("feed").lastElementChild) {
    fresh = logGroup = h("div", { class: "log-group", "data-turn": key },
      h("div", { class: `log-turn ${side || ""}` }, turnLabel({ side, half: p.half || 1, ht: p.ht, at: p.at })));
  }
  const seekable = R.active && p.frame != null;
  (p.lines || []).forEach((l) => logGroup.append(h("div", {
    class: `log-line ${l.k ? "k-" + l.k : ""} ${seekable ? "seek" : ""}`, "data-frame": p.frame, "data-turn": key,
    title: seekable ? "Show this moment on the board" : null,
    onclick: seekable ? () => { play(false); seek(p.frame); } : null,
  }, ...logText(l.t))));
  return fresh;
}

function evNode(e) {
  const p = e.payload || {}, who = e.side ? names()[e.side] : "";
  const head = (kind) => h("div", {}, h("span", { class: "who" }, who), h("span", { class: "kind" }, kind));
  switch (e.kind) {
    case "play": return playNodes(e);
    case "message": return h("div", { class: `bubble ${e.side}` }, h("span", { class: "who" }, who), p.text);
    case "thought": return h("div", { class: `ev thought ${e.side}` }, head("thinking"), h("div", { class: "body" }, p.text));
    case "tool": return h("div", { class: `ev tool ${e.side} ${p.ok ? "" : "bad"} ${INFO_TOOLS.has(p.name) ? "info" : ""}` },
        head(p.ok ? (INFO_TOOLS.has(p.name) ? "look" : "action") : "invalid"),
        h("div", { class: "call" }, toolText(p.name, p.args)),
        h("details", {}, h("summary", {}, "details"), h("pre", {}, `${p.name}(${argStr(p.args)})` + (p.result ? "\n\n" + p.result : ""))));
    case "episode": return h("div", { class: `ev episode ${e.side}` }, `${who} · ${p.our_turn ? "turn " + p.key.split("-").slice(1).join("-") : p.proc}`);
    case "reflection": return h("div", { class: `ev reflection ${e.side}` }, head(`plan · turn ${p.turn}${p.trigger === "reflect" ? " (after turnover)" : ""}`),
        h("div", {}, h("b", {}, "Plan: "), p.plan), h("div", { class: "secondary" }, h("b", {}, "Expects: "), p.prediction));
    case "illegal": return null;
    default: return h("div", { class: `ev ${e.kind} ${e.side || ""}` }, e.side ? head(e.kind) : null, p.text || JSON.stringify(p));
  }
}
const INFO_TOOLS = new Set(["get_state", "get_legal_actions", "get_player"]);

// replay: highlight what just happened, i.e. the lines of the latest turn up to the frame on the board
// (sync off: also bring them into view)
function markCurrent() {
  if (!R.active || tab !== "log") return;
  const box = document.getElementById("feed"), nodes = [...box.querySelectorAll(".log-line[data-frame]")];
  const past = nodes.filter((n) => +n.dataset.frame <= R.idx), turn = past.length ? past[past.length - 1].dataset.turn : null;
  let first = null;
  nodes.forEach((n) => {
    const on = turn !== null && n.dataset.turn === turn && +n.dataset.frame <= R.idx;
    n.classList.toggle("now", on);
    if (on && !first) first = n;
  });
  if (first && !R.sync) {
    const b = box.getBoundingClientRect(), r = first.getBoundingClientRect();
    if (r.top < b.top + 30 || r.bottom > b.bottom) box.scrollTop += r.top - b.top - 40;
  }
}

function visible(e) {
  if (tab === "log") return e.kind === "play" || e.kind === "error" || (e.kind === "system" && !e.side);
  if (e.kind === "play") return false;
  if (tab === "chat") return e.kind === "message" || (e.kind === "system" && !e.side);
  if (tab === "plans") return e.kind === "reflection";
  if (tab === "home" || tab === "away") return e.side === tab;
  return true;
}

let shown = 0;   // events[0:shown] are rendered (filtered by tab)

function feedLimit() {
  if (!(R.active && R.sync)) return events.length;
  const cut = cutoffTs();
  let lo = 0, hi = events.length;   // events are in id (= time) order: binary search the cutoff
  while (lo < hi) { const mid = (lo + hi) >> 1; if (events[mid].ts <= cut) lo = mid + 1; else hi = mid; }
  return lo;
}

function renderFeed(reset) {
  const box = document.getElementById("feed");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const lim = feedLimit();
  if (reset || lim < shown) { box.innerHTML = ""; shown = 0; reset = true; logGroup = null; }
  const empty = box.querySelector(".empty");
  if (empty && lim > shown) empty.remove();
  events.slice(shown, lim).filter(visible).forEach((e) => { const n = evNode(e); if (n) box.append(n); });
  shown = lim;
  if (!box.children.length) box.append(h("div", { class: "empty" }, R.active && R.sync && lim < events.length ? "Nothing yet at this point of the replay." : tab === "chat" ? "No messages yet. Models can trash-talk with the send_message tool."
    : tab === "log" && match && match.status !== "running" && match.status !== "queued" && !events.some((e) => e.kind === "play")
      ? "No game log was recorded for this match (it was played before the log existed). Model reasoning has the moves."
    : "Nothing here yet."));
  if (atBottom || reset || R.playing) box.scrollTop = box.scrollHeight;
  if (reset) markCurrent();
}

function renderStats() {
  const hs = match.home_stats, as = match.away_stats;
  if (!hs || !as) return;
  if (!(R.active && R.hide && R.idx < R.points.length - 1)) document.getElementById("stats-card").style.display = "";
  const rows = [
    ["Touchdowns", "touchdowns"], ["Blocks", "blocks"], ["Blitzes", "blitzes"], ["Fouls", "fouls"],
    ["Passes", "passes"], ["Hand-offs", "handoffs"], ["Knock-downs inflicted", "knockdowns_inflicted"],
    ["Casualties inflicted", "casualties_inflicted"], ["Turnovers", "turnovers"], ["Re-rolls used", "rerolls_used"],
    ["Dodges / GFIs", (s) => (s.dodges || 0) + (s.gfis || 0)], ["Messages sent", "messages_sent"],
    ["Tool calls", "tool_calls"], ["Invalid tool calls", "invalid_tool_calls"], ["Auto/forced actions", "forced_actions"],
    ["Tokens", (s) => (s.prompt_tokens || 0) + (s.completion_tokens || 0), fmt.tokens],
    ["Cached input tokens", "cached_tokens", fmt.tokens], ["Cost", "cost", fmt.usd],
    ["Safe-first rate", "safe_first_rate", (v) => (v == null ? "–" : fmt.pct(v))],
    ["Avg success of risky actions", "avg_risky_success", (v) => (v == null ? "–" : fmt.pct(v))],
    ["Players idle at turnover", "unactivated_at_turnover", (v) => (v == null ? "–" : fmt.num(v, 1))],
    ["Monitoring rate", "monitoring_rate", fmt.pct], ["Reflections written", "reflections"],
    ["Aggression (blocks+blitzes+fouls / turn)", "aggression", (v) => fmt.num(v, 2)],
    ["Risk taking (dodges+GFIs / turn)", "risk_taking", (v) => fmt.num(v, 2)],
  ];
  const t = document.getElementById("stats"); t.innerHTML = "";
  t.append(h("thead", {}, h("tr", {}, h("th", { class: "num side-a" }, match.away_name), h("th", { style: { textAlign: "center" } }, ""), h("th", { class: "side-h" }, match.home_name))));
  const tb = h("tbody");
  rows.forEach(([label, key, f]) => {
    const get = typeof key === "function" ? key : (s) => (s[key] === null ? null : s[key] || 0);
    const a = get(as), b = get(hs), F = f || ((v) => fmt.num(v));
    tb.append(h("tr", {}, h("td", { class: a > b ? "lead" : "" }, F(a)), h("td", {}, label), h("td", { class: b > a ? "lead" : "" }, F(b))));
  });
  t.append(tb);
  const meta = match.meta || {};
  const ml = document.getElementById("meta-line"); ml.innerHTML = "";
  const parts = [];
  if (meta.seed != null) parts.push(`seed ${meta.seed}`);
  if (meta.harness) parts.push(`harness ${meta.harness.git_sha} · protocol ${meta.harness.protocol_version} · prompts ${meta.harness.prompt_fingerprint}`);
  for (const side of ["away", "home"]) {
    const served = Object.keys((meta.served || {})[side] || {});
    if (served.length) parts.push(`${match[side + "_name"]} served by ${served.join(", ")}`);
  }
  ml.append(parts.join(" · "));
  if (meta.admissible === false) ml.append(h("span", { class: "badge", style: { marginLeft: "6px" } }, "not admissible: " + (meta.inadmissible_reasons || []).join(", ")));
  if (match.has_transcript) ml.append(" · ", h("a", { href: `/api/matches/${MATCH_ID}/transcript` }, "download full transcript (.jsonl.gz)"));
}

const EVENT_PAGE = 1000;   // the events API returns at most this many per call
function fetchEvents() {
  return api(`/api/matches/${MATCH_ID}/events?after=${lastId}`).then((ev) => {
    if (!ev.length) return;
    events.push(...ev); lastId = ev[ev.length - 1].id;
    if (ev.length >= EVENT_PAGE) return fetchEvents();
  });
}

function poll() {
  const before = events.length;
  return Promise.all([api(`/api/matches/${MATCH_ID}`), fetchEvents()]).then(([m]) => {
    const wasRunning = match && match.status === "running";
    match = m; renderHeader();
    if (events.length > before) renderFeed(false);
    if (m.status === "completed" || m.status === "error") {
      renderStats();
      if (wasRunning) setTimeout(() => location.reload(), 1500);
      return false;
    }
    return true;
  });
}
function showTab(name) {
  document.querySelectorAll(".feed-tabs button").forEach((x) => x.classList.toggle("active", x.dataset.tab === name));
  if (tab !== name) { tab = name; renderFeed(true); }
  else { const box = document.getElementById("feed"); box.scrollTop = box.scrollHeight; markCurrent(); }
}
document.querySelectorAll(".feed-tabs button").forEach((b) => b.onclick = () => showTab(b.dataset.tab));
const wide = window.matchMedia("(min-width: 1001px)");
const fitFeed = () => {
  const card = document.getElementById("stadium-card"), feed = document.getElementById("feed-card");
  feed.style.height = wide.matches ? card.offsetHeight + "px" : "";
};
new ResizeObserver(fitFeed).observe(document.getElementById("stadium-card"));
wide.addEventListener("change", fitFeed);

let timer = null;
poll().then((more) => {
  renderFeed(true);
  if (more) timer = setInterval(() => poll().then((go) => { if (!go) clearInterval(timer); }), 1500);
});
</script>
