{% extends "base.html" %}
{% block content %}
<div id="now"></div>
<div class="grid grid-2 section">
  <div class="card"><h2>Up next</h2><div id="queued"></div></div>
  <div class="card"><h2>Recent results <a class="muted" style="font-size:.85rem;font-weight:400;margin-left:auto" href="/matches">All matches →</a></h2><div id="recent"></div></div>
</div>
<div class="card section">
  <h2>Top of the table <a class="muted" style="font-size:.85rem;font-weight:400;margin-left:auto" href="/leaderboard">Full leaderboard →</a></h2>
  <div class="table-wrap"><table id="top"><thead><tr><th class="rank">#</th><th>Model</th><th class="num">Elo</th><th class="num">W-D-L</th><th class="num">TD +/-</th></tr></thead><tbody></tbody></table></div>
</div>
{% endblock %}
{% block scripts %}
<script src="/bench-static/board.js"></script>
<script>
const { h, api, fmt } = BB;
let liveId = null;

let board = null;

// "Inside the coaches' heads": a live taste of the match centre beside the board, so it's clear what
// opening it gets you. Keeps only each coach's latest thought, the latest play and the plans, not the whole
// event history. Only the button links to the match centre, so the panel can be read and selected freely.
const T = { id: null, last: 0, box: null, m: null, thoughts: {}, play: null, plans: {}, live: {} };
function teaser(m) {
  Object.assign(T, { id: m.id, last: 0, m, thoughts: {}, play: null, plans: {},
    box: h("div", { class: "hp-teaser" }) });
  drawTeaser();
  pollTeaser();
  return T.box;
}
function pollTeaser() {
  const id = T.id;
  if (!id) return;
  api(`/api/matches/${id}/events?after=${T.last}`).then((ev) => {
    if (id !== T.id || !ev.length) return;
    T.last = ev[ev.length - 1].id;
    for (const e of ev) {
      if (e.kind === "thought" && e.side) T.thoughts[e.side] = e;
      else if (e.kind === "play" && e.side && (e.payload.lines || []).length) T.play = e;
      else if (e.kind === "reflection") T.plans[e.side] = e;
    }
    if (ev.length >= 1000) return pollTeaser();   // catching up on a long game: the API pages at 1000
    drawTeaser();
  }).catch(() => {});
}
setInterval(pollTeaser, 3000);
function drawTeaser() {
  const nm = { home: T.m.home_name, away: T.m.away_name }, box = T.box;
  box.innerHTML = "";
  box.append(h("h2", {}, "Inside the coaches' heads"));
  // Both coaches' latest thoughts, newest first: they share whatever height the board leaves free.
  // a reply still streaming in goes first, live; otherwise each coach's latest finished thought
  const live = Object.entries(T.live || {}).filter(([, x]) => x.text);
  live.forEach(([side, x]) => box.append(h("div", { class: `hp-think ${side}` },
    h("div", { class: "hp-who" }, nm[side], h("span", { class: "muted" }, ` is thinking · live · ≈${Math.round(x.chars / 4).toLocaleString()} tokens`)),
    h("div", { class: "hp-quote" }, "…" + x.text.slice(-600)))));
  const ths = Object.values(T.thoughts).filter((th) => !live.some(([side]) => side === th.side)).sort((a, b) => b.id - a.id);
  if (!ths.length && !live.length) box.append(h("div", { class: "muted" }, "Waiting for the first move…"));
  ths.forEach((th, i) => box.append(h("div", { class: `hp-think ${th.side}` },
    h("div", { class: "hp-who" }, nm[th.side], h("span", { class: "muted" }, i || live.length ? " last thought" : " is thinking")),
    h("div", { class: "hp-quote" }, th.payload.text))));
  if (T.play) box.append(h("div", { class: "hp-last" }, h("span", { class: "muted" }, "Latest: "),
    T.play.payload.lines[T.play.payload.lines.length - 1].t.replace(/Home\(H\)/g, nm.home).replace(/Away\(A\)/g, nm.away)));
  for (const side of ["away", "home"]) {
    const r = T.plans[side];
    box.append(h("div", { class: `hp-plan ${side}` }, h("b", {}, `${nm[side]}'s plan: `), r ? r.payload.plan : h("span", { class: "muted" }, "none yet")));
  }
  box.append(h("a", { class: "btn primary hp-cta", href: `/match/${T.id}` }, "Open the match centre →"),
    h("div", { class: "muted hp-cap" }, "Full reasoning, game plans, moves and dice for both models, live."));
}

// When the game on screen finishes, keep its final board up for a while before switching to the next
// match: the next game kicks off within a second, so switching straight away looks like the game restarted.
const FULL_TIME_HOLD_MS = 60000;
let hold = null;   // { id, until, nextBox } while a finished game stays on screen

function showFullTime(done, next) {
  if (!hold || hold.id !== done.id) {
    hold = { id: done.id, until: Date.now() + FULL_TIME_HOLD_MS, nextBox: h("span", { class: "now-next" }) };
    const bar = document.querySelector("#now .now-bar");
    if (bar) {
      bar.innerHTML = "";
      const res = done.winner === "draw" ? "draw" : `${done.winner === "home" ? done.home_name : done.away_name} wins`;
      bar.append(h("span", { class: "badge" }, "FULL TIME"),
        h("span", { class: "muted" }, `${done.away_name} ${done.away_score} – ${done.home_score} ${done.home_name} · ${res} · `,
          h("a", { href: `/match/${done.id}` }, "watch the replay")),
        hold.nextBox);
    }
  }
  hold.nextBox.innerHTML = "";
  if (next) hold.nextBox.append(h("button", { type: "button", class: "btn", onclick: () => { hold.until = 0; refresh(); } },
    `Next: ${next.away_name} vs ${next.home_name} →`));
}

function renderNow(s) {
  const box = document.getElementById("now");
  const m = s.live[0];
  if (liveId && (!m || m.id !== liveId)) {
    const done = s.recent.find((r) => r.id === liveId && r.status === "completed");
    if (done && !(hold && hold.id === done.id && Date.now() >= hold.until)) { showFullTime(done, m); return; }
  }
  hold = null;
  if (!m) {
    if (board) board.stop();
    liveId = null; board = null; T.id = null;
    box.innerHTML = "";
    const last = s.recent[0];
    box.append(h("div", { class: "card" },
      h("h1", {}, "No game in progress"),
      h("p", { class: "secondary" }, s.detail || ""),
      last ? h("p", {}, "Last result: ", h("a", { href: `/match/${last.id}` }, `${last.away_name} ${last.away_score ?? ""} – ${last.home_score ?? ""} ${last.home_name}`),
        " · ", h("a", { href: `/match/${last.id}` }, "watch the replay")) : null));
    return;
  }
  if (liveId === m.id) return;
  liveId = m.id;
  box.innerHTML = "";
  const stadiumEl = h("div", {}, h("div", { class: "stadium-empty" }, "Loading the board…"));
  box.append(h("div", { class: "card stadium-card" },
    h("div", { class: "now-bar" }, h("span", { class: "badge live" }, "● LIVE"), h("span", { class: "muted" }, "Now playing"),
      W.el = h("span", { class: "muted now-wait" })),
    h("div", { class: "hp-split" }, stadiumEl, teaser(m))));
  if (board) board.stop();
  board = BBBoard.create(stadiumEl, { names: () => ({ home: m.home_name, away: m.away_name }) });
  board.live(m.id);
}

// whose reply the game is waiting on and for how long, on the server's clock
const W = { el: null, m: null, seen: 0 };
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function drawWait() {
  if (!W.el) return;
  const m = W.m, w = m && m.id === liveId && !hold ? Object.entries(m.waiting || {}) : [];
  const now = Date.now() / 1000 + (m && m.server_time ? m.server_time - W.seen : 0);
  W.el.textContent = w.filter(([, x]) => now - x.since >= 3).map(([side, x]) => `${m[side + "_name"]} is thinking · ${mmss(Math.max(0, now - x.since))}`).join(" · ");
}
setInterval(drawWait, 1000);

function refresh() {
  api("/api/status").then((s) => {
    renderNow(s);
    W.m = s.live[0] || null; W.seen = Date.now() / 1000; drawWait();
    T.live = (W.m && W.m.id === T.id && W.m.waiting) || {};
    if (T.box) drawTeaser();
    const q = document.getElementById("queued"); q.innerHTML = "";
    if (!s.queued.length) q.append(h("div", { class: "empty" }, "Nothing queued."));
    s.queued.forEach((m) => q.append(BB.matchRow(m)));
    const r = document.getElementById("recent"); r.innerHTML = "";
    if (!s.recent.length) r.append(h("div", { class: "empty" }, "No games played yet."));
    s.recent.forEach((m) => r.append(BB.matchRow(m)));
  });
}
api("/api/leaderboard").then((lb) => {
  const tb = document.querySelector("#top tbody");
  lb.models.slice(0, 5).forEach((m, i) => tb.append(h("tr", {},
    h("td", { class: "rank" }, i + 1), h("td", {}, h("a", { href: `/models/${m.id}` }, m.name)),
    h("td", { class: "num" }, fmt.num(m.elo)), h("td", { class: "num" }, `${m.wins}-${m.draws}-${m.losses}`),
    h("td", { class: "num" }, `${m.td_for}/${m.td_against}`))));
});
refresh();
setInterval(refresh, 4000);
</script>
{% endblock %}
