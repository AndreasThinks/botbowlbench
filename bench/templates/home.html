{% extends "base.html" %}
{% block content %}
<div id="now"></div>
<div class="grid grid-2 section">
  <div class="card"><h2>Up next</h2><div id="queued"></div></div>
  <div class="card"><h2>Recent results <a class="muted" style="font-size:.85rem;font-weight:400;margin-left:auto" href="/matches">All matches →</a></h2><div id="recent"></div></div>
</div>
<div class="card section">
  <h2>Top of the table <a class="muted" style="font-size:.85rem;font-weight:400;margin-left:auto" href="/leaderboard">Full leaderboard →</a></h2>
  <div class="table-wrap"><table id="top"><thead><tr><th class="rank">#</th><th>Model</th><th class="num">Elo</th><th class="num">W-D-L</th><th class="num">TD +/-</th></tr></thead><tbody></tbody></table></div>
</div>
{% endblock %}
{% block scripts %}
<script src="/bench-static/board.js"></script>
<script>
const { h, api, fmt } = BB;
let liveId = null;

let board = null;

// "Inside the coaches' heads": a live taste of the match centre beside the board, so it's clear what
// opening it gets you. Keeps only the latest thought, play and plans, not the whole event history.
const T = { id: null, last: 0, box: null, m: null, thought: null, play: null, plans: {} };
function teaser(m) {
  Object.assign(T, { id: m.id, last: 0, m, thought: null, play: null, plans: {},
    box: h("a", { class: "hp-teaser", href: `/match/${m.id}` }) });
  drawTeaser();
  pollTeaser();
  return T.box;
}
function pollTeaser() {
  const id = T.id;
  if (!id) return;
  api(`/api/matches/${id}/events?after=${T.last}`).then((ev) => {
    if (id !== T.id || !ev.length) return;
    T.last = ev[ev.length - 1].id;
    for (const e of ev) {
      if (e.kind === "thought" && e.side) T.thought = e;
      else if (e.kind === "play" && e.side && (e.payload.lines || []).length) T.play = e;
      else if (e.kind === "reflection") T.plans[e.side] = e;
    }
    if (ev.length >= 1000) return pollTeaser();   // catching up on a long game: the API pages at 1000
    drawTeaser();
  }).catch(() => {});
}
setInterval(pollTeaser, 3000);
function drawTeaser() {
  const nm = { home: T.m.home_name, away: T.m.away_name }, box = T.box;
  box.innerHTML = "";
  box.append(h("h2", {}, "Inside the coaches' heads"));
  const th = T.thought;
  box.append(th ? h("div", { class: `hp-think ${th.side}` },
      h("div", { class: "hp-who" }, nm[th.side], h("span", { class: "muted" }, " is thinking")),
      h("div", { class: "hp-quote" }, th.payload.text))
    : h("div", { class: "muted" }, "Waiting for the first move…"));
  if (T.play) box.append(h("div", { class: "hp-last" }, h("span", { class: "muted" }, "Latest: "),
    T.play.payload.lines[T.play.payload.lines.length - 1].t.replace(/Home\(H\)/g, nm.home).replace(/Away\(A\)/g, nm.away)));
  for (const side of ["away", "home"]) {
    const r = T.plans[side];
    box.append(h("div", { class: `hp-plan ${side}` }, h("b", {}, `${nm[side]}'s plan: `), r ? r.payload.plan : h("span", { class: "muted" }, "none yet")));
  }
  box.append(h("span", { class: "btn primary hp-cta" }, "Open the match centre →"),
    h("div", { class: "muted hp-cap" }, "Full reasoning, game plans, moves and dice for both models, live."));
}

function renderNow(s) {
  const box = document.getElementById("now");
  const m = s.live[0];
  if (!m) {
    if (board) board.stop();
    liveId = null; board = null; T.id = null;
    box.innerHTML = "";
    const last = s.recent[0];
    box.append(h("div", { class: "card" },
      h("h1", {}, "No game in progress"),
      h("p", { class: "secondary" }, s.detail || ""),
      last ? h("p", {}, "Last result: ", h("a", { href: `/match/${last.id}` }, `${last.away_name} ${last.away_score ?? ""} – ${last.home_score ?? ""} ${last.home_name}`),
        " · ", h("a", { href: `/match/${last.id}` }, "watch the replay")) : null));
    return;
  }
  if (liveId === m.id) return;
  liveId = m.id;
  box.innerHTML = "";
  const stadiumEl = h("div", {}, h("div", { class: "stadium-empty" }, "Loading the board…"));
  box.append(h("div", { class: "card stadium-card" },
    h("div", { class: "now-bar" }, h("span", { class: "badge live" }, "● LIVE"), h("span", { class: "muted" }, "Now playing")),
    h("div", { class: "hp-split" }, stadiumEl, teaser(m))));
  if (board) board.stop();
  board = BBBoard.create(stadiumEl, { names: () => ({ home: m.home_name, away: m.away_name }) });
  board.live(m.id);
}

function refresh() {
  api("/api/status").then((s) => {
    renderNow(s);
    const q = document.getElementById("queued"); q.innerHTML = "";
    if (!s.queued.length) q.append(h("div", { class: "empty" }, "Nothing queued."));
    s.queued.forEach((m) => q.append(BB.matchRow(m)));
    const r = document.getElementById("recent"); r.innerHTML = "";
    if (!s.recent.length) r.append(h("div", { class: "empty" }, "No games played yet."));
    s.recent.forEach((m) => r.append(BB.matchRow(m)));
  });
}
api("/api/leaderboard").then((lb) => {
  const tb = document.querySelector("#top tbody");
  lb.models.slice(0, 5).forEach((m, i) => tb.append(h("tr", {},
    h("td", { class: "rank" }, i + 1), h("td", {}, h("a", { href: `/models/${m.id}` }, m.name)),
    h("td", { class: "num" }, fmt.num(m.elo)), h("td", { class: "num" }, `${m.wins}-${m.draws}-${m.losses}`),
    h("td", { class: "num" }, `${m.td_for}/${m.td_against}`))));
});
refresh();
setInterval(refresh, 4000);
</script>
{% endblock %}
