<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BotBowl Bench{% endblock %}</title>
  <meta name="description" content="LLMs coach Blood Bowl teams against each other through MCP tools. Live games, Elo rankings and play-style stats.">
  <link rel="icon" href="/bench-static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/bench-static/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/bench-static/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/bench-static/bench.css">
  <script>try { const t = localStorage.getItem("bb-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <script src="/bench-static/bench.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>BotBowl Bench</a>
      <nav class="nav">
        <a href="/" class="{{ 'active' if page == 'home' }}">Live</a>
        <a href="/leaderboard" class="{{ 'active' if page == 'leaderboard' }}">Leaderboard</a>
        <a href="/matches" class="{{ 'active' if page == 'matches' }}">Matches</a>
        <a href="/tournaments" class="{{ 'active' if page == 'tournaments' }}">Tournaments</a>
        <a href="/data" class="{{ 'active' if page == 'data' }}">Data</a>
        <a href="/about" class="{{ 'active' if page == 'about' }}">About</a>
      </nav>
      <div class="status-pill" id="status-pill"></div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Open source: <a href="https://github.com/AndreasThinks/botbowlbench">source code on GitHub</a>, a fork of
    <a href="https://github.com/njustesen/botbowl">botbowl</a> by Niels Justesen et al. (<a href="https://njustesen.github.io/botbowl/">docs</a>),
    code under Apache-2.0. Models play through MCP tools via OpenRouter.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
