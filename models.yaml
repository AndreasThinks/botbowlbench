# BotBowl Bench competitors.
#
# Every time a model is added here (and the service restarts or picks up the change), a "gauntlet"
# is scheduled: the new model plays every other enabled model, home and away, one game at a time.
# The very first time the bench starts with 2+ models, a full round-robin tournament is scheduled.
#
# Fields per model:
#   name       display name (unique). Changing it creates a new competitor.
#   model      OpenRouter model id, see https://openrouter.ai/models (needs tool-calling support)
#   provider   openrouter (default) | random | scripted | botbowl   (the others are free offline baselines)
#   bot, module  (botbowl only) a bot id from botbowl's registry, and the module to import so it registers
#   enabled    false = keep history but stop scheduling games
#   temperature, max_tokens, budget_usd_per_game, max_tool_calls_per_turn, turn_time_limit (optional)
#   prompt_cache  true/false: add cache breakpoints (default: on for anthropic/* models; others cache automatically)
#   extra      dict merged into the OpenRouter request body, e.g. {reasoning: {effort: low}}
#   delay      (baselines only) seconds per move, to make their games watchable

settings:
  game_mode: 5                  # players per side (1, 3, 5, 7 or 11). 5 keeps games short and cheap.
  team: human                   # both sides use the same roster (mirror matches)
  max_tool_calls_per_turn: 40
  turn_time_limit: 300          # seconds per team turn (raise per model for slow reasoning models)
  max_game_minutes: 120         # wall-clock cap per game, so one slow model can't block the queue
  max_messages_per_turn: 2
  budget_usd_per_game: 1.00     # safety cap per model, per game (one final request may overshoot). Hitting it
                                # hands the rest of the game to the fallback policy, so keep it well above normal spend.
  legs: 2                       # play each pairing home and away
  pause_between_matches: 5

models:
  - name: Scripted baseline
    provider: scripted
    delay: 0.4                  # seconds per move, so baseline games are watchable

  - name: Random baseline
    provider: random
    delay: 0.4

  - name: Bot Bowl scripted bot     # botbowl's official scripted bot (examples/scripted_bot_example.py)
    provider: botbowl
    bot: scripted
    module: examples.scripted_bot_example
    max_tool_calls_per_turn: 200  # it moves one square per call, so a busy turn needs more than 40
    delay: 0.4

  - name: GPT-5 mini
    model: openai/gpt-5-mini

  - name: Gemini 2.5 Flash Lite
    model: google/gemini-2.5-flash-lite

  - name: DeepSeek V3.2
    model: deepseek/deepseek-v3.2

  - name: Mistral Large 4
    model: mistralai/mistral-large-4-0

  - name: GPT-6 Luna
    model: openai/gpt-6-luna

  - name: Qwen 3.8 Flash
    model: qwen/qwen3.8-flash
