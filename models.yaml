# BotBowl Bench competitors.
#
# Every time a model is added here (and the service restarts or picks up the change), a "placement"
# is scheduled: the new model plays 5 anchor models spread across the current ratings, home and away,
# then up to 6 top-up games against the opponents it is closest to. The cost per newcomer stays the
# same however long this list gets (see the placement_* settings below; placement_size: 0 = play everyone).
# The very first time the bench starts with 2+ models, a full round-robin tournament is scheduled.
#
# Fields per model:
#   name       display name (unique). Changing it creates a new competitor.
#   model      OpenRouter model id, see https://openrouter.ai/models (needs tool-calling support)
#   provider   openrouter (default) | random | scripted | botbowl   (the others are free offline baselines)
#   bot, module  (botbowl only) a bot id from botbowl's registry, and the module to import so it registers
#   enabled    false = keep history but stop scheduling games
#   description  shown on the model's page. Optional: LLMs use OpenRouter's description, baselines a built-in one
#   temperature, max_tokens, reasoning_max_tokens, reasoning_enabled, tool_choice, budget_usd_per_game, max_tool_calls_per_turn,
#              turn_time_limit, last_chance_seconds, reply_time_limit (optional; override the settings below)
#   prompt_cache  true/false: add cache breakpoints (default: on for anthropic/* models; others cache automatically)
#   extra      dict merged into the OpenRouter request body, e.g. {reasoning: {effort: low}}
#   delay      (baselines only) seconds per move, to make their games watchable

settings:
  game_mode: 5                  # players per side (1, 3, 5, 7 or 11). 5 keeps games short and cheap.
  team: human                   # both sides use the same roster (mirror matches)
  max_tool_calls_per_turn: 40
  turn_time_limit: 300          # seconds per team turn, a hard deadline: a reply still running is cancelled
  max_output_tokens: 16384      # same max_tokens ceiling for every model; a model's own max_tokens (or null) overrides
  reasoning_max_tokens: null    # no shared thinking budget: each model thinks at its own default effort...
  reasoning_enabled: true       # ...with thinking switched on where it is optional. A per-model budget or extra.reasoning overrides
  tool_choice: required         # replies must be tool calls (falls back to auto where a provider rejects it)
  last_chance_seconds: 45       # held back per turn: a reply still running then is cancelled for one short "act now" call
  reply_time_limit: 120         # one reply still running after 120s is stopped, its thinking handed back, and the model acts (null = off)
  provider_sort: throughput     # every model goes to its fastest OpenRouter host (null = OpenRouter's default routing)
  provider_min_throughput: 50   # ...preferring hosts that recently ran at 50+ tokens/s (null = no preference)
  provider_max_price_factor: 3  # ...that costs at most 3x the model's listed price (the listing is often the slowest host; null = no cap)
  max_game_minutes: 180         # wall-clock cap per game, so a stuck game can't block the queue. Keep it above
                                # 32 team turns x turn_time_limit (160 min) or slow pairings get capped mid-game
  max_messages_per_turn: 2
  budget_usd_per_game: null     # no spending cap: cost is tracked per model per game instead. A number caps it, and
                                # hitting it hands the rest of the game to the fallback policy.
  legs: 2                       # play each pairing home and away
  pause_between_matches: 5
  placement_size: 5             # anchors a newcomer plays (home and away), spread from top to bottom of the table
  placement_extra_games: 6      # most top-up games after that, against the least predictable opponents

models:
  - name: Scripted baseline
    provider: scripted
    delay: 0.4                  # seconds per move, so baseline games are watchable

  - name: Random baseline
    provider: random
    delay: 0.4

  - name: Bot Bowl scripted bot     # botbowl's official scripted bot (examples/scripted_bot_example.py)
    provider: botbowl
    bot: scripted
    module: examples.scripted_bot_example
    description: >-
      The example scripted bot that ships with the botbowl framework: a hand-coded
      turn plan that stands players up, scores or hands off when the odds are good, moves the ball
      carrier safely upfield and makes the safest blocks it can find, using real pathfinding.
    max_tool_calls_per_turn: 200  # it moves one square per call, so a busy turn needs more than 40
    delay: 0.4

  - name: GPT-5 mini
    model: openai/gpt-5-mini

  - name: Gemini 2.5 Flash Lite
    model: google/gemini-2.5-flash-lite

  - name: Gemini 4 Argon
    model: google/gemini-4-argon

  - name: DeepSeek V3.2
    model: deepseek/deepseek-v3.2

  - name: Mistral Large 4
    model: mistralai/mistral-large-4-0

  - name: GPT-6 Luna
    model: openai/gpt-6-luna

  - name: Qwen 3.8 Flash
    model: qwen/qwen3.8-flash

  - name: Claude Haiku 5.5
    model: anthropic/claude-haiku-5.5

  - name: GPT-6.1 Sol 
    model: openai/gpt-6.1-sol

  - name: Claude Opus 5.5
    model: anthropic/claude-opus-5.5

  - name: DeepSeek V4.1 Flash
    model: deepseek/deepseek-v4.1-flash

  - name: Muse Wonder
    model: meta/muse-wonder

  - name: Muse Spark Open
    model: meta/muse-spark-open

  - name: Reflection Beam 1.0
    model: reflection/beam-1.0-501b-a23b

  - name: Nemotron 3.5 Super VL
    model: nvidia/nemotron-3.5-super-vl

  - name: Flint
    model: recursive/flint-v1.0:free

  - name: Liquid LFM2.5-24B-A2B
    model: liquid/lfm-2.5-24b-a2b
