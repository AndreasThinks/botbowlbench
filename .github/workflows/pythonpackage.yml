name: Python package

on:
  pull_request:
  push:
    branches: [main]

# Both jobs install what the deployed image installs (Dockerfile): Python 3.11, requirements-bench.txt and the
# compiled pathfinding.
jobs:
  engine:
    # the botbowl game engine
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements-bench.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-bench.txt pytest flake8
        cythonize -i -3 botbowl/core/pathfinding/cython_pathfinding.pyx
    - name: Check for syntax errors and undefined names
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Test engine
      run: PYTHONPATH=. pytest --ignore=tests/bench -q

  bench:
    # BotBowl Bench (LLM benchmark server)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements-bench.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-bench.txt pytest ruff
        cythonize -i -3 botbowl/core/pathfinding/cython_pathfinding.pyx
    - name: Lint bench
      run: ruff check bench tests/bench
    - name: Test bench
      run: PYTHONPATH=. pytest tests/bench -q
